backend:
  name: github
  repo: Yves251/Residance-meubl-es-
  branch: main
  base_url: https://api.netlify.com

media_folder: "images"
public_folder: "/images"

locale: "fr"

collections:
  - name: "departments"
    label: "Départements"
    files:
      - file: "departments.json"
        label: "Départements et appartements"
        name: "departments_data"
        fields:
          - label: "Départements"
            name: "departments"
            widget: "list"
            label_singular: "Département"
            summary: "{{fields.name}}"
            fields:
              - label: "Nom du département"
                name: "name"
                widget: "select"
                options:
                  [
                    "Alibori", "Atacora", "Atlantique", "Borgou", "Collines",
                    "Couffo", "Donga", "Littoral", "Mono", "Ouémé", "Plateau", "Zou",
                  ]
              - label: "Photo du département"
                name: "photo"
                widget: "image"
                required: false
                hint: "Optionnel — s'affiche sur la tuile du département en page d'accueil"
              - label: "Appartements"
                name: "apartments"
                widget: "list"
                label_singular: "Appartement"
                summary: "{{fields.name}} — {{fields.pricePerNight}} FCFA"
                fields:
                  - { label: "Nom de l'appartement", name: "name", widget: "string" }
                  - label: "Mis en avant (payant)"
                    name: "featured"
                    widget: "boolean"
                    default: false
                    hint: "Coche cette case pour les propriétaires qui ont payé la mise en avant — ces annonces remontent en tête de la liste sur le site."
                  - { label: "Ville / Quartier", name: "city", widget: "string" }
                  - { label: "Prix par nuit (FCFA)", name: "pricePerNight", widget: "number", value_type: "int" }
                  - label: "Numéro WhatsApp"
                    name: "whatsapp"
                    widget: "string"
                    hint: "Format international sans le +, ex: 22990000000"
                  - label: "Caractéristiques"
                    name: "amenities"
                    widget: "list"
                    hint: "Un équipement/caractéristique par ligne, ex: Wi-Fi, Climatisation..."
                  - { label: "Description", name: "description", widget: "text" }
                  - label: "Photos"
                    name: "photos"
                    widget: "list"
                    required: false
                    hint: "Les 2 premières s'affichent sur la fiche, les autres dans le détail."
                    field: { label: "Photo", name: "image", widget: "image" }
